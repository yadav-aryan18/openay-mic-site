name: Bake releases

on:
  schedule:
    - cron: "17 * * * *" # hourly
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bake releases from the GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # higher rate limit; the token is repo-scoped
        run: node scripts/generate-releases.mjs

      - name: Commit baked data if changed
        run: |
          git config user.name "openay-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/releases.js
          if git diff --cached --quiet; then
            echo "No release changes since last bake."
          else
            git commit -m "release-bot: bake latest releases"
            git push
          fi
